<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim jest Mateusz Prevoz?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            padding: 40px 20px;
        }
        .card { 
            background: #1e1e1e; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            padding: 30px; 
            text-align: center; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .profile-pic { 
            width: 100px; 
            height: 100px; 
            background: #333; 
            border-radius: 50%; 
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #00ffaa; }
        .tag { font-size: 14px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .bio { font-size: 16px; line-height: 1.5; color: #ddd; margin-bottom: 25px; }
        .links-title { font-size: 14px; text-align: left; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .btn { 
            display: block; 
            background: #2a2a2a; 
            color: #ffffff; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #3a3a3a; color: #00ffaa; }
    </style>
</head>
<body>

    <div class="card">
       
<img src="mateusz1.png" alt="Friend's Profile" class="profile-pic">

        
        <!-- Friend's Info (Change this text!) -->
        <h1>Mateusz Prevoz</h1>
        <div class="tag">Radny miasta Poznań</div>
        <p class="bio">Mateusz Prevoz to Polityk urodzony w Śremie w 1982 roku, narodowości Polsko-Amerykańsko-Izraelskiej prawnik, były dziennikarz oraz Polityk.</p>
        
        <!-- Social Links (Change the URLs inside href="...") -->
        <div class="links-title">Skontaktujmy się tutaj:</div>
        <a class="btn" href="https://www.instagram.com/pisowiec_2027/" target="_blank">Instagram</a>
        <a class="btn" href="https://www.tiktok.com/@mateusz.kasprzyk7" target="_blank">TikTok</a>
        <a class="btn" href="https://spotify.com" target="_blank">Favorite Playlist</a>
    </div>

</body>
</html>
